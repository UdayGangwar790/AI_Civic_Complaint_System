# ==============================================================================
# CVKI — Civic Vision & Knowledge Intelligence
# Module 1.7: YOLOv8n Baseline Training Configuration
# ==============================================================================

# Model Specification
model: yolov8n.pt                  # Pretrained YOLOv8 Nano weights for transfer learning

# Dataset Configuration
data: C:/Users/sushm/OneDrive/Desktop/CIVKI/ai/computer_vision/dataset/data.yaml

# Training Hyperparameters
epochs: 100                        # Maximum number of training epochs
imgsz: 640                         # Input image resolution (640x640)
batch: 16                          # Batch size (set to integer for stability; auto if needed)
patience: 20                       # Early stopping patience in epochs without validation improvement
seed: 42                           # Deterministic random seed for reproducibility
deterministic: true                # Enforce deterministic algorithmic choices in PyTorch/CUDA

# Hardware & Execution Environment
device: cpu                        # Detected hardware: Intel(R) Core(TM) i5-1235U CPU (No CUDA GPU)
workers: 2                         # Number of worker threads for dataloader (0-2 recommended on Windows)

# Output & Artifact Settings
project: C:/Users/sushm/OneDrive/Desktop/CIVKI/ai/computer_vision/training/runs
name: yolov8n_baseline_300         # Subdirectory under runs/ for this training experiment
exist_ok: true                     # Dedicated experiment directory
save: true                         # Save checkpoints (last.pt and best.pt)
save_period: -1                    # Save checkpoint every N epochs (-1 disables periodic saving, keeps best/last)
plots: true                        # Generate confusion matrix, PR curves, and loss graphs
val: true                          # Run validation after every epoch
verbose: true                      # Verbose output logging
