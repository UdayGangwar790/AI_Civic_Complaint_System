experiment_id: CVR2-CV-006
experiment_type: baseline
dataset:
  id: D1
  version: '1.0'
  train_split: train
  val_split: val
  test_split: test
model:
  id: R3-YOLO-ROBUST-BASE
  version: '1.0'
  architecture: YOLOv8n
  input_size: 640
  confidence_threshold: 0.25
  iou_threshold: 0.45
training:
  seed: 42
  epochs: 10
  batch_size: 8
  learning_rate: 0.001
  optimizer: AdamW
  device: cpu
evaluation:
  metrics:
  - precision
  - recall
  - mAP50
  - mAP50_95
