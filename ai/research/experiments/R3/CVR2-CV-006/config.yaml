  reproducibility_class: REPRODUCIBLE CONFIGURATION
hypothesis:
  question: Can an expanded training budget calibrate YOLOv8n confidence onto D1 without
    cross-split leakage?
  hypothesis: A 10-epoch training regime provides sufficient logit scaling to establish
    an optimal operating threshold on validation data.
  independent_variable: Training epoch budget (10 epochs)
  dependent_variables:
  - Confidence distribution
  - Operating threshold F1
  - mAP50
  - mAP50-95
  controls:
  - YOLOv8n backbone
  - Seed 42
  - Conservative augmentation
  - D1 train split
  - D1 val split
  expected_outcome: Validation sweep identifies an optimal F1 threshold > 0.001.
  actual_outcome: unknown
  conclusion: unknown
