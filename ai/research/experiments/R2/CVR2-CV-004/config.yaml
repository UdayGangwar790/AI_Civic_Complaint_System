  hypothesis: Conservative augmentation provides superior localization stability on
    small objects like damaged signs.
  independent_variable: Augmentation hyperparameters (fliplr, degrees, scale, mosaic)
  dependent_variables:
  - mAP50
  - mAP50-95
  - precision
  - recall
  controls:
  - YOLOv8n backbone
  - seed 42
  - 3 epochs
  - batch 8
  - identical D1 train/test splits
